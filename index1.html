<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <style>
        :root {
            --bg-color: #1b0a14;
            --accent-color: #ff9ecd;
            --accent-dark: #d94f8c;
            --pattern-color: rgba(255, 158, 205, 0.07);
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 50% 40%, rgba(255, 105, 180, 0.18) 0%, transparent 60%),
                linear-gradient(135deg, var(--pattern-color) 25%, transparent 25%),
                linear-gradient(225deg, var(--pattern-color) 25%, transparent 25%),
                linear-gradient(45deg, var(--pattern-color) 25%, transparent 25%),
                linear-gradient(315deg, var(--pattern-color) 25%, transparent 25%);
            background-size: 100% 100%, 60px 60px, 60px 60px, 60px 60px, 60px 60px;
            font-family: 'Georgia', serif;
            overflow-x: hidden;
            color: white;
        }

        .container {
            text-align: center;
            position: relative;
            max-width: 600px;
            padding: 40px 20px;
            z-index: 10;
        }

        .header {
            font-size: 1.8rem;
            margin-bottom: 70px;
            color: var(--accent-color);
            letter-spacing: 2px;
            text-shadow: 0 4px 15px rgba(255, 158, 205, 0.45);
            font-style: italic;
            position: relative;
            z-index: 20;
        }

        .cake-container {
            position: relative;
            width: 200px;
            height: 500px;
            margin: -160px auto -10px auto;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
        }

        #cake {
            display: block;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .candles {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: absolute;
            top: 350px; 
            left: 50%;
            transform: translateX(-50%) translateY(-200px);
            opacity: 0;
            z-index: 10;
            animation: dropInCandles 0.6s 6.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes dropInCandles {
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        .candle {
            width: 16px;
            height: 62px;
            position: relative;
            cursor: pointer;
            background: repeating-linear-gradient(
                45deg,
                #ffffff 0px,
                #ffffff 6px,
                #ff6b81 6px,
                #ff6b81 12px
            );
            border-radius: 3px 3px 0 0;
            box-shadow:
                inset -3px 0 5px rgba(0,0,0,0.25),
                inset 3px 0 5px rgba(255,255,255,0.4);
        }

        .wick {
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 7px;
            background: #3d2b1f;
        }

        .flame {
            position: absolute;
            top: -32px;
            left: 50%;
            width: 18px;
            height: 30px;
            margin-left: -9px;
            border-radius: 50% 50% 20% 20%;
            background: radial-gradient(circle at 50% 75%, #fff5fa 0%, #ffb3d9 30%, #ff8c00 70%, #ff4500 100%);
            box-shadow: 0 0 20px 6px rgba(255, 165, 0, 0.55);
            transform-origin: center bottom;
            animation: flicker 0.45s ease-in-out infinite alternate;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        @keyframes flicker {
            0%   { transform: scale(1) rotate(-2deg);   opacity: 0.9; }
            100% { transform: scale(1.12) rotate(2deg); opacity: 1; }
        }

        .candle.out .flame {
            animation: none;
            transform: scale(0);
            opacity: 0;
            box-shadow: none;
        }

        .smoke {
            position: absolute;
            top: -30px;
            left: 50%;
            width: 10px;
            height: 10px;
            margin-left: -5px;
            border-radius: 50%;
            background: rgba(220, 220, 220, 0.45);
            opacity: 0;
            pointer-events: none;
        }

        .candle.out .smoke {
            animation: puff 1.4s ease-out forwards;
        }

        @keyframes puff {
            0%   { opacity: 0.7; transform: translateY(0) scale(0.6); }
            100% { opacity: 0;   transform: translateY(-55px) scale(2.2); }
        }

        .interaction-area {
            margin-top: 15px;
            opacity: 0;
            animation: fadeIn 1s 7.2s ease-out forwards;
            transition: opacity 0.5s ease;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .instruction-text {
            color: var(--accent-color);
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .back-link {
            display: inline-block;
            margin-top: 45px;
            color: rgba(255,255,255,0.35);
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .back-link:hover { color: var(--accent-color); }

        .video-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 90%;
            max-width: 640px;
            background: #1b0a14;
            padding: 24px;
            border: 3px solid var(--accent-color);
            border-radius: 12px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(255, 158, 205, 0.25);
            z-index: 100;
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease-out;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .video-modal-open {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        .video-modal iframe {
            width: 100%;
            height: 360px;
            max-height: 70vh;
            border-radius: 8px;
            outline: none;
            background: #000;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            border: 0;
        }

        .close-btn {
            display: block;
            margin: 20px auto 0 auto;
            padding: 10px 30px;
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: rgba(255, 158, 205, 0.18);
            color: #ffffff;
        }

        #confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
            display: none;
        }

        @media screen and (max-width: 600px) {
            .header { font-size: 1.4rem; margin-bottom: 55px; }
            .cake-container { margin-top: -120px; }
            .candles { gap: 15px; }
            .video-modal { padding: 16px; width: 94%; }
        }
    </style>
</head>
